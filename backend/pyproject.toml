[project]
name = "did-backend"
version = "0.1.0"
description = "Backend автономного исследователя: ядро миссии, планирование, LLM-адаптер и HTTP"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
