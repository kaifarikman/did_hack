# Стек MVP. Сервис simulation: Gazebo (headless) + локальный судья + супервизор reset.
services:
  simulation:
    build:
      context: .
      dockerfile: infra/Dockerfile.simulation
    image: did-sim:dev
    init: true
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-7}"
      GZ_PARTITION: ${GZ_PARTITION:-did}
      INITIAL_SEED: "0"
    volumes:
      - ./simulation:/workspace/simulation
    command: ["python3", "/workspace/simulation/scripts/supervisor.py"]
    ports:
      - "${GUI_PORT:-6080}:6080"   # noVNC для профиля gui
    expose:
      - "7000"   # HTTP супервизора: POST /reset {"seed": N}, GET /status
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request as u; import sys; sys.exit(0 if json.load(u.urlopen('http://localhost:7000/status'))['state']=='ready' else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Показ настоящего Gazebo: docker compose --profile gui up -d gui → http://localhost:6080/vnc.html
  gui:
    profiles: ["gui"]
    build:
      context: .
      dockerfile: infra/Dockerfile.gui
    init: true
    network_mode: "service:simulation"  # gz-transport: общий сетевой стек с сервером
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-7}"
      GZ_PARTITION: ${GZ_PARTITION:-did}
    volumes:
      - ./simulation:/workspace/simulation
    command: ["/workspace/simulation/scripts/gui_entrypoint.sh"]
    depends_on:
      simulation:
        condition: service_healthy

  backend:
    build:
      context: backend
    init: true
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-7}"
      ROS_ODOM_TOPIC: "${ROS_ODOM_TOPIC:-/odom}"
      ROS_SCAN_TOPIC: "${ROS_SCAN_TOPIC:-/scan}"
      STUCK_WINDOW_S: "${STUCK_WINDOW_S:-6.0}"
      STUCK_MIN_PROGRESS_M: "${STUCK_MIN_PROGRESS_M:-0.05}"
      SIMULATION_URL: http://simulation:7000
      MAP_YAML: /workspace/simulation/judge/data/map.yaml
      JOURNAL_DIR: /data/journal
      LLM_ENDPOINT: ${LLM_ENDPOINT:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_S: "${LLM_TIMEOUT_S:-8}"
      LLM_MAX_ATTEMPTS: "${LLM_MAX_ATTEMPTS:-2}"
      LLM_FAILURE_THRESHOLD: "${LLM_FAILURE_THRESHOLD:-2}"
      LLM_RECOVERY_COOLDOWN_S: "${LLM_RECOVERY_COOLDOWN_S:-30}"
    volumes:
      - ./simulation/judge/data:/workspace/simulation/judge/data:ro
      - journal:/data/journal
    expose:
      - "8000"
    depends_on:
      simulation:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Панель: docker compose up → http://localhost:8080
  frontend:
    build:
      context: frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  journal:
